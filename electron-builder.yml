appId: com.ragflow.orchestrator-desktop
productName: Orchestrator Desktop
directories:
  output: dist
icon: build/icon.png
files:
  - out/**/*
  - examples/**/*
  - '!examples/private/**'
  - '!private/**'
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Orchestrator Desktop
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Apple Silicon only. Intel Macs are not a release target.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  title: ${productName} ${version}
linux:
  target:
    - AppImage
npmRebuild: false
