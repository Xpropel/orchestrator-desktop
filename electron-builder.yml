appId: com.ragflow.orchestrator-desktop
productName: Orchestrator Desktop
directories:
  output: dist
icon: build/icon.png
files:
  - out/**/*
  - examples/**/*
  - '!examples/private/**'
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Orchestrator Desktop
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
npmRebuild: false
